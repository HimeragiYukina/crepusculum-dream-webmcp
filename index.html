    <h1>Yunhao Luo — AI Researcher</h1>
    <p>
      I am Yunhao Luo, an AI researcher at Huawei Canada's Web Technology Lab. My current research centers
      on the agentic web: web agents, website generation, and emerging standards for making the web
      agent-friendly — alongside a foundation in character animation, physics-based simulation, and real-time
      rendering. I previously researched real-time GPU fluid
      simulation at Ubisoft La Forge and hold an M.Sc. in Computer Science from McGill University;
      my thesis work received the Best Presentation Award at MIG '21.
    </p>
    <p>
      This site is a playable HD-2D hub world (it needs JavaScript). Explore it with a keyboard or
      mouse, or collaborate with an agent through page-aware WebMCP tools. Its areas: Projects
      (a real-time GPU liquid simulator built at Ubisoft Montreal), Research (the MIG '21 publication
      "Catching and Throwing Control of a Physically Simulated Hand"), a complete deck-building character mod,
      a poetry Zine, and About.
    </p>
